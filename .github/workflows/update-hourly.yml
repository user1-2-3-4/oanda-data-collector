name: Update (hourly)

# Runs intraday granularities (M1, M5, M15, H1) every hour.
# Offset 10 minutes past the hour to avoid the surge at :00 where
# GitHub Actions jobs are often delayed.

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

# Prevent two runs from stomping on each other's commits.
concurrency:
  group: oanda-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write  # required to commit CSVs back to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch new candles
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: |
          python -m src.update \
            --schedule hourly \
            --environment practice \
            --summary-json run-summary.json

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-summary-${{ github.run_id }}
          path: run-summary.json
          if-no-files-found: ignore

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: hourly update $(date -u +%FT%TZ)"
          # Rebase in case the daily job committed in the meantime
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
